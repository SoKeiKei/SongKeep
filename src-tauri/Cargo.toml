[package]
name = "songkeep"
version = "0.3.0"
description = "Download songs and lyrics from Suno share links without signing in"
authors = ["SoKei"]
license = "MIT"
repository = "https://github.com/SoKeiKei/SongKeep"
edition = "2024"

[lib]
name = "songkeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
arboard = { version = "3", default-features = false }
base64 = "0.22"
ctr = "0.9"
futures-util = "0.3"
html-escape = "0.2"
mp3lame-encoder = "0.2.5"
opus-pure = "0.2.1"
regex = "1"
# Keep OS proxy discovery when disabling reqwest's other default features.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
